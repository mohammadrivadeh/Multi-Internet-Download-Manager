name: build-and-test
on:
  push:
    branches: [main, work]
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - run: dotnet restore DownloadManager.sln
      - run: dotnet build DownloadManager.sln -c Release --no-restore
      - run: dotnet test DownloadManager.sln -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
      - if: runner.os == 'Windows'
        run: dotnet publish application/App.Wpf/App.Wpf.csproj -c Release -r win-x64 --self-contained false -o artifacts/desktop
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: desktop-windows-x64
          path: artifacts/desktop
